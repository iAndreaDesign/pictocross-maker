<section class="editor">
  <div class="panel">
    <app-editor-toolbar />
    <app-drawing-grid />

    <footer class="footer">
      <span class="hint">
        <app-icon name="pointer" />
        {{ 'editor.footer.hint' | transloco }}
      </span>
      <span class="counter">
        {{ 'editor.footer.counter' | transloco: { filled: store.blackCount(), total: store.totalCells() } }}
      </span>
    </footer>
  </div>
</section>
