<div class="heading">
  <div class="title-wrap">
    <input
      id="project-title"
      class="title"
      type="text"
      [attr.maxlength]="maxLength"
      [value]="store.title() ?? ('editor.title.default' | transloco)"
      [attr.aria-label]="'editor.title.label' | transloco"
      (change)="onTitleChange($event)"
    />
    <label class="pencil" for="project-title">
      <app-icon name="pencil" />
    </label>
  </div>

  <!-- Acciones del proyecto (p. ej. exportar), alineadas a la izquierda, junto al título. -->
  <div class="actions">
    <ng-content />
  </div>
</div>
